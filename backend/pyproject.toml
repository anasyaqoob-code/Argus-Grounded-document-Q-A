[project]
name = "argus"
version = "0.1.0"
description = "Argus — grounded RAG with filter-at-DB, abstention, and citation validation"
readme = "README.md"
# torch 2.2.x (the last Intel-Mac build) has no wheels above Python 3.12.
# Cap here so a fresh install on 3.13+ fails loudly, not silently mid-download.
requires-python = ">=3.11,<3.13"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",

    # --- Document parsing ---
    "pypdf>=4.0.0",

    # --- LangChain stack ---
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",

    # --- Embeddings + vector store ---
    # Pinned for Intel-Mac compatibility (torch 2.2.2 is the ceiling).
    "numpy>=1.26.0,<2.0.0",
    "torch>=2.2.0,<2.3.0",
    "transformers>=4.44.0,<4.45.0",
    "sentence-transformers>=3.2.0,<3.3.0",
    "chromadb>=0.5.0",

    # --- Config ---
    "python-dotenv>=1.0.0",

    # --- PDF export ---
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

# ===========================================================================
# Pytest
# ===========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:langchain_core.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::UserWarning:chromadb.*",
]

# ===========================================================================
# Ruff
# ===========================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "frontend",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501",  # line length — handled by the formatter, not the linter
]

# ===========================================================================
# Mypy
# ===========================================================================
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = [
    "venv/",
    ".venv/",
    "frontend/",
    "data/",
]